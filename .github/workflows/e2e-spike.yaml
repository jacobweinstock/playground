# Throwaway workflow. It answers the questions that decide whether the e2e
# matrix can run on GitHub-hosted runners at all. A probe-only run on
# 2026-09-16 settled two of them:
#
#   - /dev/kvm is usable and libvirtd is reachable. virt-host-validate passes
#     hardware virtualization; the IOMMU, secure-guest and cgroup-devices
#     warnings do not apply to plain KVM guests. GitHub still documents
#     nested virtualization as unsupported, so this stays worth re-checking.
#   - Disk is not the constraint the documented 14 GB suggested: / is 145 GB
#     with 87 GB free before anything is removed.
#
# What remains unmeasured is how long a combination takes under nested virt on
# 4 shared vCPUs, which is what sets the timeout for the real workflow.
#
# Every probe reports rather than failing, and goes to both the log and the job
# summary, so a run that dies still says why. Delete this file once the matrix
# workflow exists.
name: e2e spike

on:
  workflow_dispatch:
    inputs:
      combo:
        description: "Combination to run"
        type: choice
        default: colocated-ipv4-netboot-direct
        options:
          - colocated-ipv4-netboot-direct
          - colocated-ipv4-isoboot-direct
          - external-ipv4-netboot-direct
          - external-ipv4-isoboot-direct
      tinkerbell_repo:
        description: "Build Tinkerbell from this git repo (blank = released artifacts)"
        type: string
        default: ""
      tinkerbell_ref:
        description: "Build Tinkerbell from this branch, tag or commit"
        type: string
        default: ""
      probe_only:
        description: "Run the probes and stop, without creating a playground"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: capt
    env:
      # Skips `task install-binaries`; the flox environment supplies those tools.
      USE_PATH_BINARIES: "true"
      COMBO: ${{ inputs.combo }}
      # flox reads any config option from FLOX_<SCREAMING_SNAKE_CASE>, which
      # outranks both flox.toml files. auth_notifications quiets the FloxHub
      # login advisory; it does not suppress authentication errors.
      FLOX_DISABLE_METRICS: "true"
      FLOX_AUTH_NOTIFICATIONS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # tee, not a plain redirect: the summary alone is invisible to anyone
      # reading the log, which is where a failed run gets diagnosed.
      - name: Baseline resources
        run: |
          {
            echo "## Baseline"
            echo '```'
            echo "nproc:  $(nproc)"
            free -h
            echo
            df -h / /mnt 2>/dev/null || df -h /
            echo
            echo "virt flags: $(grep -om1 -E 'vmx|svm' /proc/cpuinfo || echo none)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          df --output=used -k / | tail -1 > /tmp/disk-baseline

      # libvirtd is a system daemon that wants /dev/kvm, an AppArmor profile and
      # firmware descriptors it reads itself, so it comes from apt rather than
      # flox. flox covers the playground's own tooling, which is userspace.
      - name: Install the virtualization stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-kvm libvirt-daemon-system libvirt-clients virtinst ovmf cpu-checker

      # Group membership needs a new login session, which a workflow step is
      # not, so the socket is opened up instead. Fine on a throwaway VM.
      - name: Enable KVM and libvirt access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo usermod -aG kvm,libvirt "$USER" || true
          sudo systemctl enable --now libvirtd || true
          sudo chmod 666 /var/run/libvirt/libvirt-sock || true
          sudo virsh net-start default 2>/dev/null || true

      - name: Probe KVM and libvirt
        id: probe
        continue-on-error: true
        run: |
          kvm_ok=no; libvirt_ok=no
          [ -e /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ] && kvm_ok=yes
          virsh -c qemu:///system version >/dev/null 2>&1 && libvirt_ok=yes
          {
            echo "## KVM / libvirt probe"
            echo '```'
            ls -l /dev/kvm 2>&1 || echo "/dev/kvm absent"
            kvm-ok 2>&1 || true
            echo
            virsh -c qemu:///system version 2>&1 || true
            echo
            # The IOMMU, secure-guest and cgroup-devices warnings are expected
            # here and irrelevant: no device passthrough, no confidential VMs.
            virt-host-validate qemu 2>&1 | grep -Ev '^\s*$' || true
            echo '```'
            echo "- /dev/kvm usable: **$kvm_ok**"
            echo "- libvirtd reachable: **$libvirt_ok**"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "kvm_ok=$kvm_ok" >> "$GITHUB_OUTPUT"
          echo "libvirt_ok=$libvirt_ok" >> "$GITHUB_OUTPUT"

      - name: Install flox
        uses: flox/install-flox-action@v2

      # Which virt-install wins matters: flox ships one via virt-manager and apt
      # ships another. Both talk to the same host libvirtd, but only the report
      # says which was used if the run misbehaves.
      #
      # activate-action runs its command via `flox activate -c '<command>'`, so
      # nothing here may contain a single quote, and it does not inherit
      # defaults.run.working-directory -- hence the explicit cd.
      - name: Resolved toolchain
        uses: flox/activate-action@v1
        with:
          command: cd capt && for b in go task cue helm kind kubectl clusterctl yq virsh virt-install docker; do printf "%-14s %s\n" "$b" "$(command -v "$b" || echo MISSING)"; done | tee /tmp/toolchain.txt

      - name: Record toolchain
        working-directory: .
        run: |
          {
            echo "## Toolchain"
            echo '```'
            cat /tmp/toolchain.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Sample disk usage in the background
        if: ${{ !inputs.probe_only }}
        run: |
          nohup bash -c 'while true; do df --output=used -k / | tail -1; sleep 15; done' \
            > /tmp/disk-samples 2>/dev/null &
          echo $! > /tmp/disk-sampler.pid

      # Built here rather than inside the activate command so the inputs stay in
      # environment variables instead of being interpolated into a shell string.
      - name: Compose runner arguments
        if: ${{ !inputs.probe_only }}
        env:
          TINKERBELL_REPO: ${{ inputs.tinkerbell_repo }}
          TINKERBELL_REF: ${{ inputs.tinkerbell_ref }}
        run: |
          args="$COMBO --plain"
          [ -n "$TINKERBELL_REPO" ] && args="$args --tinkerbell-repo $TINKERBELL_REPO"
          [ -n "$TINKERBELL_REF" ] && args="$args --tinkerbell-ref $TINKERBELL_REF"
          echo "E2E_ARGS=$args" >> "$GITHUB_ENV"
          date +%s > /tmp/run-start

      - name: Run ${{ inputs.combo }}
        if: ${{ !inputs.probe_only }}
        id: run
        continue-on-error: true
        uses: flox/activate-action@v1
        with:
          command: cd capt && ./e2e/run.sh $E2E_ARGS

      - name: Report
        if: always()
        working-directory: .
        run: |
          [ -f /tmp/disk-sampler.pid ] && kill "$(cat /tmp/disk-sampler.pid)" 2>/dev/null || true
          {
            echo "## Result"
            echo "- combo: \`$COMBO\`"
            echo "- outcome: **${{ steps.run.outcome || 'not run' }}**"
            if [ -f /tmp/run-start ]; then
              secs=$(( $(date +%s) - $(cat /tmp/run-start) ))
              echo "- duration: **$(( secs / 60 ))m $(( secs % 60 ))s**"
            fi
            if [ -s /tmp/disk-samples ]; then
              peak=$(sort -n /tmp/disk-samples | tail -1)
              base=$(cat /tmp/disk-baseline 2>/dev/null || echo 0)
              echo "- peak disk used by the run: **$(( (peak - base) / 1024 )) MiB**"
            fi
            echo
            echo '```'
            df -h /
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-spike-${{ inputs.combo }}
          path: |
            capt/e2e/artifacts/${{ inputs.combo }}/
          if-no-files-found: warn
          retention-days: 7

      # A cancelled job skips the runner's own teardown, and the VM is discarded
      # anyway -- but a failed teardown here is a real signal for the matrix
      # workflow, where it would leak on a persistent runner.
      - name: Is there a playground to remove?
        if: always() && !inputs.probe_only
        id: leftover
        working-directory: .
        run: |
          dir="capt/e2e/artifacts/$COMBO"
          if [ -f "$dir/config.yaml" ] && [ -f "$dir/state.yaml" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "no config/state pair under $dir; nothing to remove"
          fi

      - name: Teardown
        if: always() && steps.leftover.outputs.found == 'true'
        continue-on-error: true
        uses: flox/activate-action@v1
        with:
          command: cd capt && task delete-playground CONFIG_FILE=$PWD/e2e/artifacts/$COMBO/config.yaml STATE_FILE=$PWD/e2e/artifacts/$COMBO/state.yaml
